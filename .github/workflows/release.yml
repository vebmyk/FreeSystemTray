# Builds both portable versions (tools/Publish.ps1) and creates a draft GitHub release with the two
# zips when a version tag (v0.1.2, ...) is pushed. The tag must match <Version> in
# src/FreeSystemTray/FreeSystemTray.csproj. The release text is release-notes/VERSION.md if that
# file exists, otherwise GitHub's generated notes. The release stays a draft: the smoke tests
# (tests/smoke) cannot run on a hosted runner, so run them against the zips' exes, then publish it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.1.2)"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag against the project version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/FreeSystemTray/FreeSystemTray.csproj)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match the project version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: dotnet test tests/FreeSystemTray.Tests/FreeSystemTray.Tests.csproj -c Release

      - name: Publish both portable builds
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/Publish.ps1

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zips = @(
            "dist/FreeSystemTray-$env:VERSION-win-x64.zip",
            "dist/FreeSystemTray-$env:VERSION-win-x64-framework-dependent.zip")
          foreach ($zip in $zips) { if (-not (Test-Path $zip)) { throw "Missing $zip." } }
          $notes = "release-notes/$env:VERSION.md"
          $text = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          gh release create $env:TAG @zips --draft --verify-tag --title "FreeSystemTray $env:VERSION" @text
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
