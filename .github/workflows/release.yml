# Builds both portable versions (tools/Publish.ps1) and creates a draft GitHub release with the two
# zips when a version tag (v0.1.2, ...) is pushed. The tag must match <Version> in
# src/FreeSystemTray/FreeSystemTray.csproj. The release text is release-notes/VERSION.md if that
# file exists, otherwise GitHub's generated notes. The release stays a draft: the smoke tests
# (tests/smoke) cannot run on a hosted runner, so run them against the zips' exes, then publish it.
# Run by hand (Actions, Release, Run workflow), it builds the given tag, or, if that tag does not
# exist yet, the chosen branch, and creates the tag there with the release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2). Created on the chosen branch if it does not exist."
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the tag if it exists
        id: tag
        shell: pwsh
        run: |
          git fetch --tags --force origin
          git rev-parse -q --verify "refs/tags/$env:TAG" | Out-Null
          if ($LASTEXITCODE -eq 0) {
            git checkout -q "refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not check out $env:TAG." }
            "exists=true" >> $env:GITHUB_OUTPUT
            Write-Host "Building the existing tag $env:TAG."
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
            Write-Host "Tag $env:TAG does not exist; building $(git rev-parse HEAD) and creating the tag there."
          }
          $global:LASTEXITCODE = 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Check the tag against the project version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/FreeSystemTray/FreeSystemTray.csproj)).Project.PropertyGroup.Version |
            Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match the project version $version." }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Unit tests
        run: dotnet test tests/FreeSystemTray.Tests/FreeSystemTray.Tests.csproj -c Release

      - name: Publish both portable builds
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/Publish.ps1

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_EXISTS: ${{ steps.tag.outputs.exists }}
        run: |
          $zips = @(
            "dist/FreeSystemTray-$env:VERSION-win-x64.zip",
            "dist/FreeSystemTray-$env:VERSION-win-x64-framework-dependent.zip")
          foreach ($zip in $zips) { if (-not (Test-Path $zip)) { throw "Missing $zip." } }
          $notes = "release-notes/$env:VERSION.md"
          $text = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          $tagArgs = if ($env:TAG_EXISTS -eq "true") { @("--verify-tag") } else { @("--target", (git rev-parse HEAD)) }
          gh release create $env:TAG @zips --draft @tagArgs --title "FreeSystemTray $env:VERSION" @text
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
